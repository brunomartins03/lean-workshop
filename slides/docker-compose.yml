services:
  latex:
    build: .
    image: lean-workshop-latex:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      sh -c "
        pdflatex -interaction=nonstopmode -halt-on-error main.tex &&
        biber main &&
        pdflatex -interaction=nonstopmode -halt-on-error main.tex &&
        pdflatex -interaction=nonstopmode -halt-on-error main.tex
      "
